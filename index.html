
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAEE — Anomali Celin</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap');

:root {
    --bg: #090909;
    --surface: #101010;
    --line: #292929;
    --text: #ededed;
    --muted: #858585;
    --red: #a63838;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
}

.page {
    width: min(100%, 950px);
    margin: auto;
    padding: 30px 35px 40px;
}

/* HEADER */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
}

.brand {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
}

.status {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: #bb5555;
}

/* INTRO */

.intro {
    margin-top: 48px;
}

.eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--red);
    letter-spacing: 3px;
    margin-bottom: 13px;
}

.intro h1 {
    font-size: clamp(42px, 8vw, 76px);
    line-height: 1;
    letter-spacing: -3px;
    font-weight: 800;
}

.intro-description {
    margin-top: 15px;
    color: var(--muted);
    font-size: 15px;
}

/* SUBJECT */

.subject {
    display: flex;
    align-items: center;
    gap: 25px;
    margin-top: 38px;
    padding: 22px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
}

.avatar {
    width: 126px;
    height: 126px;
    flex-shrink: 0;
    object-fit: contain;
    background: #151515;
}

.subject-info h2 {
    font-size: 25px;
    margin-bottom: 7px;
}

.subject-info p {
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
}

.subject-info .classification {
    color: #b85c5c;
    margin-top: 13px;
}

/* READING AREA */

.reader {
    margin-top: 38px;
    min-height: 300px;
    animation: appear .35s ease;
}

.chapter-label {
    font-family: 'DM Mono', monospace;
    color: var(--red);
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.reader h2 {
    font-size: clamp(27px, 5vw, 39px);
    letter-spacing: -1px;
    margin-bottom: 25px;
}

.reader p {
    font-size: clamp(17px, 2.2vw, 20px);
    color: #c3c3c3;
    line-height: 1.9;
    margin-bottom: 20px;
    font-weight: 400;
}

.reader strong {
    color: #f0eeee;
    font-weight: 700;
}

/* NAVIGATION */

.navigation {
    margin-top: 35px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
}

.progress-info {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    margin-bottom: 13px;
}

.progress-track {
    height: 2px;
    width: 100%;
    background: #292929;
    margin-bottom: 22px;
}

.progress-bar {
    height: 100%;
    width: 25%;
    background: var(--red);
    transition: width .3s ease;
}

.buttons {
    display: flex;
    justify-content: space-between;
    gap: 12px;
}

button {
    border: 1px solid #393939;
    background: transparent;
    color: #ddd;
    padding: 14px 25px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .2s;
}

button:hover:not(:disabled) {
    background: #a63838;
    border-color: #a63838;
    color: white;
}

button:disabled {
    opacity: .25;
    cursor: not-allowed;
}

.footer {
    margin-top: 50px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    color: #666;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
}

/* TRANSITION */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width: 600px) {
    .page {
        padding: 22px 20px 30px;
    }

    .intro {
        margin-top: 38px;
    }

    .subject {
        gap: 17px;
        margin-top: 28px;
    }

    .avatar {
        width: 105px;
        height: 105px;
    }

    .subject-info h2 {
        font-size: 21px;
    }

    .reader {
        margin-top: 30px;
    }

    .reader p {
        line-height: 1.8;
    }

    button {
        padding: 13px 17px;
    }

    .footer {
        gap: 12px;
        flex-wrap: wrap;
    }
}

@media(max-height: 750px) and (min-width: 601px) {
    .intro {
        margin-top: 25px;
    }

    .subject {
        margin-top: 20px;
        padding: 15px 0;
    }

    .avatar {
        width: 95px;
        height: 95px;
    }

    .reader {
        margin-top: 22px;
        min-height: 230px;
    }

    .reader p {
        font-size: 17px;
        line-height: 1.65;
    }

    .footer {
        margin-top: 25px;
    }
}
</style>
</head>

<body>

<main class="page">

    <header class="topbar">
        <div class="brand">GRAEE / ARCHIVE</div>
        <div class="status">RESTRICTED FILE</div>
    </header>

    <!-- INTRO TETAP TAMPIL -->
    <section class="intro">
        <div class="eyebrow">SUBJECT DOCUMENTATION / 0147</div>
        <h1>ANOMALI CELIN</h1>
        <p class="intro-description">
            Dokumentasi mengenai entitas yang tidak biasa.
        </p>
    </section>

    <!-- AVATAR TETAP TAMPIL -->
    <section class="subject">

        <img
            class="avatar"
            id="avatar"
            src=""
            alt="Roblox avatar Celin"
        >

        <div class="subject-info">
            <h2>CELIN</h2>
            <p>@ev3lyn_y4p</p>
            <p class="classification">
                CLASSIFICATION: ANOMALOUS
            </p>
        </div>

    </section>

    <!-- KONTEN BERGANTI -->
    <section class="reader" id="reader">

        <div class="chapter-label" id="chapter">
            REPORT 01 / 04
        </div>

        <h2 id="heading">Gaming Behavior</h2>

        <div id="content"></div>

    </section>

    <!-- NAVIGASI -->
    <section class="navigation">

        <div class="progress-info">
            <span>DOCUMENT PROGRESS</span>
            <span id="page-number">01 / 04</span>
        </div>

        <div class="progress-track">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div class="buttons">
            <button id="back" onclick="changePage(-1)" disabled>
                ← BACK
            </button>

            <button id="next" onclick="changePage(1)">
                NEXT →
            </button>
        </div>

    </section>

    <footer class="footer">
        <span>GRAEE RESEARCH ARCHIVE</span>
        <span>RECORD 0147</span>
    </footer>

</main>

<script>

/* ==========================
   ROBLOX AVATAR API
========================== */

async function loadAvatar() {
    const avatar = document.getElementById("avatar");

    try {
        const response = await fetch(
            "https://users.roblox.com/v1/usernames/users",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    usernames: ["ev3lyn_y4p"],
                    excludeBannedUsers: true
                })
            }
        );

        if (!response.ok) throw new Error("User lookup failed");

        const result = await response.json();

        if (!result.data || !result.data.length) {
            throw new Error("User not found");
        }

        const userId = result.data[0].id;

        const thumb = await fetch(
            `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=420x420&format=Png&isCircular=false`
        );

        if (!thumb.ok) throw new Error("Thumbnail unavailable");

        const thumbnailData = await thumb.json();

        if (!thumbnailData.data?.[0]?.imageUrl) {
            throw new Error("No image");
        }

        avatar.src = thumbnailData.data[0].imageUrl;

    } catch (error) {
        avatar.alt = "Avatar tidak tersedia";
        avatar.src = "";
        avatar.style.display = "none";
        console.error(error);
    }
}

loadAvatar();


/* ==========================
   REPORT PAGES
========================== */

const reports = [

    {
        chapter: "REPORT 01 / 04",
        title: "Gaming Behavior",

        paragraphs: [
            `Subjek yang dikenal dengan nama <strong>Celin</strong>
            merupakan salah satu entitas yang sering ditemukan
            dalam lingkungan permainan Roblox, khususnya
            <strong>Violence District</strong>. Berdasarkan catatan
            pengamatan, subjek memiliki kebiasaan bermain menggunakan
            bot, menciptakan situasi yang cukup membingungkan
            bagi pemain lain.`,

            `Aktivitas lainnya meliputi kebiasaan meledukkan generator,
            mengalami fenomena pistol kopong ketika sedang bermain,
            serta sering melakukan knock. Perilaku tersebut membuat
            kehadiran subjek menjadi salah satu fenomena paling
            tidak terduga dalam lingkungan permainan.`
        ]
    },

    {
        chapter: "REPORT 02 / 04",
        title: "Daily Habits",

        paragraphs: [
            `Di luar aktivitas permainan, Celin memiliki sejumlah
            kebiasaan yang cukup menarik untuk didokumentasikan.
            Salah satunya adalah kebiasaan jarang makan nasi.
            Aktivitas makan tampaknya bukan merupakan prioritas
            utama dalam rutinitas hariannya.`,

            `Subjek juga dikenal memiliki kecenderungan bermalas-malasan.
            Rebahan merupakan salah satu kegiatan favoritnya.
            Dalam banyak kesempatan, Celin dapat menghabiskan waktu
            dengan berbaring sambil scrolling TikTok, seolah-olah
            tidak memiliki kewajiban lain di dunia ini.`,

            `Berdasarkan pengamatan sementara, kasur dan ponsel
            merupakan dua objek yang memiliki hubungan sangat erat
            dengan aktivitas sehari-hari subjek.`
        ]
    },

    {
        chapter: "REPORT 03 / 04",
        title: "Midnight Activity",

        paragraphs: [
            `Fenomena lain yang ditemukan dalam pengamatan terhadap
            Celin adalah kebiasaan terbangun secara tiba-tiba
            pada tengah malam. Pola waktu tersebut sering kali
            tidak dapat diprediksi dan menjadi salah satu
            karakteristik unik dari subjek.`,

            `Ketika sebagian besar lingkungan sudah memasuki waktu
            istirahat, subjek terkadang justru kembali aktif.
            Jadwal tidur yang tidak menentu ini membuat aktivitas
            malam Celin menjadi salah satu bagian paling misterius
            dalam dokumentasi GRAEE.`
        ]
    },

    {
        chapter: "REPORT 04 / 04",
        title: "Final Observation",

        paragraphs: [
            `Dari keseluruhan laporan, dapat disimpulkan bahwa
            Celin merupakan entitas dengan kombinasi perilaku
            yang cukup unik. Mulai dari aktivitas absurd dalam
            Violence District hingga kebiasaan sehari-hari
            yang dipenuhi rebahan dan scrolling TikTok.`,

            `Hingga saat ini, subjek masih berada dalam daftar
            pengamatan GRAEE. Tidak ditemukan pola yang sepenuhnya
            konsisten untuk menjelaskan seluruh kebiasaannya.`,

            `<strong>Kesimpulan:</strong> Celin bukan sekadar
            pemain biasa. Ia adalah fenomena yang keberadaannya
            masih sulit dijelaskan oleh logika manusia.`
        ]
    }

];


/* ==========================
   PAGE NAVIGATION
========================== */

let currentPage = 0;

function renderPage() {

    const report = reports[currentPage];

    const reader = document.getElementById("reader");

    reader.style.animation = "none";
    void reader.offsetWidth;
    reader.style.animation = "appear .35s ease";

    document.getElementById("chapter").textContent =
        report.chapter;

    document.getElementById("heading").textContent =
        report.title;

    document.getElementById("content").innerHTML =
        report.paragraphs.map(p => `<p>${p}</p>`).join("");

    const total = reports.length;

    document.getElementById("page-number").textContent =
        `${String(currentPage + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;

    document.getElementById("progress").style.width =
        ((currentPage + 1) / total * 100) + "%";

    document.getElementById("back").disabled =
        currentPage === 0;

    document.getElementById("next").disabled =
        currentPage === total - 1;

    document.getElementById("next").textContent =
        currentPage === total - 1 ? "END OF FILE" : "NEXT →";
}

function changePage(direction) {

    const newPage = currentPage + direction;

    if (newPage < 0 || newPage >= reports.length) {
        return;
    }

    currentPage = newPage;
    renderPage();
}

renderPage();

</script>

</body>
</html>
